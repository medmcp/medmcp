name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    # Known vulnerabilities in what the published image installs: the locked
    # Python runtime dependencies and the frontend's production dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python (pip-audit)
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          # CVE-2026-59951 (mcp 1.28.1, pinned by mistral-vibe): unbounded session
          # state in Streamable HTTP *servers*. MedMCP only runs stdio servers and
          # vibe's HTTP client; drop the exception when vibe's pin moves.
          # CVE-2026-114603 (opentelemetry-api 1.39.1, pinned by mistral-vibe with
          # the whole OpenTelemetry set): slow parsing of an inbound tracestate
          # header on an instrumented server. Nothing here parses inbound trace
          # headers (vibe only exports), and the fix needs a version mistralai's
          # range excludes; drop it when vibe's pin moves.
          uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip \
            --ignore-vuln CVE-2026-59951 --ignore-vuln CVE-2026-114603 -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Frontend (npm audit)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  image:
    # The published core image, weekly and on demand: fail on a critical
    # vulnerability that already has a fix, list the rest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/medmcp/core:main
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
