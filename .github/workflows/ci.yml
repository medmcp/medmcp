name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  test-neuro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.MEDMCP_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Sync
        run: uv sync --all-groups
      - name: Install medmcp-neuro stack
        run: uv tool install "git+https://github.com/medmcp/medmcp-neuro.git@453ce1b78a12f56c83bb411a77a989f6d30db219"
      - name: Pytest (with neuro stack)
        run: uv run pytest
