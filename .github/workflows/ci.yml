name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build (tsc + vite)
        run: npm run build
        working-directory: frontend
      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

  notices:
    # THIRD_PARTY_NOTICES.md is read from the *installed* deps, so this job needs
    # both toolchains (the test/frontend jobs each have only one). Regenerate and
    # fail if the committed file drifted from the resolved dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync Python runtime deps
        run: uv sync --no-dev
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Regenerate third-party notices
        run: uv run python scripts/gen_third_party_notices.py
      - name: Fail if THIRD_PARTY_NOTICES.md is out of date
        run: |
          git diff --exit-code THIRD_PARTY_NOTICES.md \
            || { echo "::error::THIRD_PARTY_NOTICES.md is stale — run 'just notices' and commit the result."; exit 1; }
