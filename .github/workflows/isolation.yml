name: Isolation
# Builds the core image and runs the shipped compose file against it with a
# scripted model (tests/e2e/isolation.py): the agent's container, its network,
# the egress gateway, broker approvals and the docker guard. These guarantees
# live in compose and docker flags as much as in code, so they are checked end
# to end rather than by unit tests alone.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-groups
      - name: Build images
        run: |
          docker build -f Dockerfile.base -t medmcp-base:dev .
          docker build --build-arg BASE_IMAGE=medmcp-base:dev -t medmcp-core:dev .
      - name: Isolation check
        env:
          # Rootful daemon on the runner.
          XDG_RUNTIME_DIR: /var/run
        run: uv run python tests/e2e/isolation.py --image medmcp-core:dev
