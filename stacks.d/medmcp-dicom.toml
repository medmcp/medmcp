# medmcp-dicom as a container stack (CPU; no GPU device needed).
# ${MEDMCP_WORKSPACE} is expanded by the core; the bind uses the same host path
# on both sides so the spawned container sees the workspace at its real path.
name = "medmcp-dicom"
command = "docker"
args = [
    "run",
    "--rm",
    "-i",
    "-v",
    "${MEDMCP_WORKSPACE}:${MEDMCP_WORKSPACE}",
    "medmcp-dicom:dev",
]
# Skills are vendored next to this manifest; path is resolved inside the core
# container (stacks.d is mounted at /app/stacks.d).
skills_path = "/app/stacks.d/medmcp-dicom/skills"
tool_timeout_sec = 1800.0
