name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        extras: ["", "neuro"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Configure SSH for private deps
        if: matrix.extras != ''
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MEDMCP_DEPLOY_KEY }}
      - name: Sync
        run: uv sync --all-groups ${{ matrix.extras != '' && format('--extra {0}', matrix.extras) || '' }}
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
