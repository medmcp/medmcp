# Deployment compose: runs the PUBLISHED images from GHCR — builds nothing.
# Fully self-contained (the Modelfile is inlined into llm-init below), so a node
# needs NO repo checkout. This file is also published as an OCI artifact by CI,
# so it can run straight from the registry:
#
#   MEDMCP_WORKSPACE=/abs/path \
#     docker compose -f oci://ghcr.io/medmcp/compose:main up -d
#
# The published images pull anonymously. `docker login ghcr.io` is needed only
# for a private mirror or for stack images you publish yourself.
#
# From a checkout you can equivalently point at this file (`just compose-up-ghcr`).
# Pin a release with MEDMCP_TAG=<git-sha> (default :main). GPU uses CDI (rootless);
# rootful hosts set XDG_RUNTIME_DIR=/var/run.
name: medmcp

services:
  llm:
    # The Ollama release this MedMCP release was tested with; bumped per release so
    # a pinned install stays put. Override with OLLAMA_IMAGE to try another.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b}
    environment:
      # Keep the model resident in VRAM (-1) so it isn't evicted after the
      # 5-minute idle default and reloaded on the next prompt. Override with a
      # duration (e.g. 30m) on shared GPUs to release VRAM when idle.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
    devices:
      - "nvidia.com/gpu=${MEDMCP_GPU:-all}"
    volumes:
      - "${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama"
    # Nothing here needs a capability or a setuid binary.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  llm-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b}
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://llm:11434"
      # Model to build and the base tag it derives from. The defaults reproduce
      # the previous behaviour exactly; setting both switches models without
      # editing this file. The core reads the same OLLAMA_MODEL, so the model the
      # agent chats with and the one built here cannot drift apart.
      MEDMCP_MODEL: "${OLLAMA_MODEL:-muse-medmcp}"
      MEDMCP_BASE_MODEL: "${MEDMCP_BASE_MODEL:-muse-glimmer:30b}"
    # Nothing here needs a capability or a setuid binary.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    # The Modelfile is inlined (not bind-mounted) so this compose file is fully
    # self-contained and can run straight from the OCI registry with no checkout.
    # Keep these PARAMETERs in sync with Modelfile.muse — the source of truth
    # for the host-native `just pull-model` path.
    command:
      - |
        if ollama list | grep -q "$$MEDMCP_MODEL"; then exit 0; fi
        ollama pull "$$MEDMCP_BASE_MODEL"
        printf '%s\n' \
          "FROM $$MEDMCP_BASE_MODEL" \
          'PARAMETER num_ctx 131072' \
          'PARAMETER temperature 0.3' \
          'PARAMETER top_p 0.95' \
          'PARAMETER top_k 64' \
          'PARAMETER repeat_penalty 1.1' \
          'PARAMETER repeat_last_n 64' \
          > /tmp/Modelfile.medmcp
        ollama create "$$MEDMCP_MODEL" -f /tmp/Modelfile.medmcp
    restart: "no"

  llm-warmup:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b}
    depends_on:
      llm:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: "http://llm:11434"
      MEDMCP_MODEL: "${OLLAMA_MODEL:-muse-medmcp}"
    # Nothing here needs a capability or a setuid binary.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    # Preload the model into VRAM at startup so the first prompt is instant
    # instead of paying the cold-load latency. Nothing depends on this service,
    # so the core UI still comes up immediately while the model warms.
    command:
      - 'ollama run "$$MEDMCP_MODEL" "ok" </dev/null >/dev/null 2>&1 || true'
    restart: "no"

  # Holds the real docker socket and gives the core a filtered one: no privileged
  # containers, host namespaces, extra capabilities or foreign mounts, and only
  # containers it created may be started, attached, stopped or removed (see
  # src/medmcp/dockerguard.py). No network; nothing to write but its socket.
  docker-guard:
    image: ghcr.io/medmcp/core:${MEDMCP_TAG:-main}${MEDMCP_CORE_DIGEST:+@${MEDMCP_CORE_DIGEST}}
    pull_policy: always
    entrypoint: ["medmcp-docker-guard"]
    environment:
      MEDMCP_WORKSPACE: "${MEDMCP_WORKSPACE:?set MEDMCP_WORKSPACE to an absolute host path}"
      MEDMCP_DOCKER_SOCKET_SOURCE: "${XDG_RUNTIME_DIR}/docker.sock"
    volumes:
      - type: bind
        source: "${XDG_RUNTIME_DIR}/docker.sock"
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - "docker-guard:/run/medmcp-guard"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  medmcp:
    # MEDMCP_CORE_DIGEST (set by the in-UI updater after verifying the
    # signature) pins the image to a digest; the tag is then informational.
    image: ghcr.io/medmcp/core:${MEDMCP_TAG:-main}${MEDMCP_CORE_DIGEST:+@${MEDMCP_CORE_DIGEST}}
    pull_policy: always
    depends_on:
      llm:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
      docker-guard:
        condition: service_started
    # Secrets for external MCP servers and a cloud model (Settings -> Advanced),
    # when they are named as environment variables rather than entered in the UI.
    # Only the variable's *name* is stored then, never its value, so the value has to
    # reach this container some other way — and `environment:` below is a fixed
    # allowlist that cannot forward a variable it does not already name. Put
    # `MY_SERVICE_TOKEN=...` lines in this file (default ./medmcp.env, override
    # with MEDMCP_ENV_FILE). Optional: absent is not an error.
    env_file:
      - path: ${MEDMCP_ENV_FILE:-./medmcp.env}
        required: false
    environment:
      OLLAMA_BASE_URL: "http://llm:11434"
      # Names the model for both the agent's chat (the entrypoint writes it into
      # config.toml, which has no env expansion) and the auxiliary calls —
      # tool-call explanations and distillation prose — which read it directly.
      OLLAMA_MODEL: "${OLLAMA_MODEL:-muse-medmcp}"
      MEDMCP_WORKSPACE: "${MEDMCP_WORKSPACE:?set MEDMCP_WORKSPACE to an absolute host path}"
      # Default to the GHCR catalog baked into the core image.
      MEDMCP_CATALOG_URL: "${MEDMCP_CATALOG_URL:-/app/catalog.ghcr.json}"
      # GPU the LLM + GPU stacks target (CDI device id). "all" = every GPU; pin
      # with an index/UUID, e.g. MEDMCP_GPU=0.
      MEDMCP_GPU: "${MEDMCP_GPU:-all}"
      # Optional registry login inside the core — for credential-helper hosts
      # that mount no plaintext auths. Leave empty to use the mounted config.
      GHCR_USER: "${GHCR_USER:-}"
      GHCR_TOKEN: "${GHCR_TOKEN:-}"
      # Persistent stack pool + pre-warm proxy (Layer 1): keeps stack backends
      # warm across calls and hides pool-machinery tools (warmup) from the model.
      # 1/true to enable; empty = off (legacy per-call spawn).
      MEDMCP_STACK_POOL: "${MEDMCP_STACK_POOL:-}"
      # Tool-call repair shim between vibe and Ollama. On by default: without it
      # Ollama's Glimmer parser silently drops roughly half of all tool-using
      # turns, and the failure is invisible — no error, just a chat that never
      # answers. Set to 0 to talk to Ollama directly.
      MEDMCP_LLM_SHIM: "${MEDMCP_LLM_SHIM:-1}"
      # How much of a streamed turn the shim relays before it is known healthy:
      # live (answer text streams as written) or buffered (answer held back so
      # every truncation can be retried invisibly).
      MEDMCP_SHIM_RELAY: "${MEDMCP_SHIM_RELAY:-live}"
      MEDMCP_SHIM_TOOLS: "${MEDMCP_SHIM_TOOLS:-glimmer}"
      # Release check (one anonymous request to GitHub a day; off with 0) and
      # where to read the newest release from (a mirror serving the same JSON).
      MEDMCP_UPDATE_CHECK: "${MEDMCP_UPDATE_CHECK:-}"
      MEDMCP_UPDATE_URL: "${MEDMCP_UPDATE_URL:-}"
      # Chat-long approval of read-only shell commands (ls, cat, …); off with 0.
      MEDMCP_READ_ONLY_APPROVAL: "${MEDMCP_READ_ONLY_APPROVAL:-}"
      # The agent runs in its own container: no docker socket, no state volume,
      # its config read-only, stack tools through the core (forces the stack
      # pool on). Empty runs it inside this container, as before.
      MEDMCP_AGENT_ISOLATION: "${MEDMCP_AGENT_ISOLATION:-container}"
      # Fixes the access token (default: generated once, kept in vibe-state).
      # Open the link `docker exec medmcp-medmcp-1 medmcp url` prints.
      MEDMCP_UI_TOKEN: "${MEDMCP_UI_TOKEN:-}"
      # 1 refuses stack images the signing policy does not cover (default: warn).
      MEDMCP_REQUIRE_SIGNED_STACKS: "${MEDMCP_REQUIRE_SIGNED_STACKS:-}"
      # Containers are started through the docker guard; the real socket's host
      # path is passed only so the update helper can be given it.
      DOCKER_HOST: "unix:///run/medmcp-guard/docker.sock"
      MEDMCP_DOCKER_SOCKET_SOURCE: "${XDG_RUNTIME_DIR}/docker.sock"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8100/healthz")
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8100:8100"
    # DAC_OVERRIDE for a rootful host, where the workspace belongs to another uid.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    # The isolated agent's network: internal, so its only peer is this container
    # (the API, the broker, and the egress gateway that reaches the model).
    networks: [default, agent]
    volumes:
      # Docker socket → core spawns sibling stack containers. Rootless by
      # default; rootful hosts set XDG_RUNTIME_DIR=/var/run. Long form so a wrong
      # path fails `up` instead of docker creating an empty directory there,
      # which leaves the core unable to start any stack ("Connection closed").
      # The docker guard's filtered socket, not the daemon's (DOCKER_HOST).
      - "docker-guard:/run/medmcp-guard"
      # Workspace at an identical absolute path (path parity for nested run -v).
      - "${MEDMCP_WORKSPACE}:${MEDMCP_WORKSPACE}"
      # Persist installed stack manifests + extracted skills across recreates.
      - "stacks-d:/app/stacks.d"
      # Persist user state across recreates: personal workflows, provenance, and
      # chat transcripts. Without these, .vibe lives in the ephemeral container
      # layer and every recreate (compose down/up, image update) wipes them.
      # Subdirs only — the baked prompts/ and the startup-written config.toml
      # stay image-fresh.
      - "vibe-workflows:/app/.vibe/workflows"
      - "vibe-provenance:/app/.vibe/provenance"
      - "vibe-runs:/app/.vibe/runs"
      - "vibe-logs:/app/.vibe/logs"
      # External MCP servers and the consent that armed them. Losing these on an
      # image update would silently disconnect a configured setup.
      - "vibe-state:/app/.vibe/state"
      # What the isolated agent container reads (config, profile, hooks,
      # prompts), published here by the core and mounted read-only there.
      - "vibe-agent:/app/.vibe/agent-home"
      # Host registry creds, read-only at a staging path — the entrypoint copies
      # only `auths` to /root/.docker/config.json, dropping the host's
      # `currentContext` (which would break every in-container stack pull/run).
      - "${HOME}/.docker/config.json:/run/host-docker-config.json:ro"
    restart: unless-stopped

networks:
  agent:
    internal: true

volumes:
  ollama-models:
  stacks-d:
  vibe-workflows:
  vibe-provenance:
  vibe-runs:
  vibe-logs:
  vibe-state:
  vibe-agent:
  docker-guard:
