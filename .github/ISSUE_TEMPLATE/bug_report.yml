name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much
        detail as you can — it speeds up triage.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: |
        MedMCP is used in clinical and research environments. Please confirm
        before submitting.
      options:
        - label: I have not pasted any patient data, PHI, or sensitive imaging metadata in this report.
          required: true
        - label: I have searched existing issues to make sure this isn't a duplicate.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you did and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `just ...`
        2. Type `...` into the chat
        3. ...
    validations:
      required: true

  - type: input
    id: medmcp-version
    attributes:
      label: MedMCP version or commit
      placeholder: e.g. 0.1.0 or commit sha
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. devstral-medmcp via Ollama
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python:
        - Ollama version:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any relevant terminal output. Will be auto-formatted as a code block.
      render: shell
    validations:
      required: false
