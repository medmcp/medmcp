# MedMCP deployment reference (also backs the devcontainer).
#
#   llm       — bundled Ollama, GPU via CDI, serves gemma4-medmcp.
#   llm-init  — one-shot: ensures the custom model exists (idempotent).
#   medmcp    — core workspace server; launches stack containers over the
#               mounted (rootless) docker socket.
#
# Required: MEDMCP_WORKSPACE = an ABSOLUTE host path (bind-mounted at the same
# path inside the core so nested `docker run -v` stays valid — path parity).
# GPU uses CDI (`nvidia.com/gpu=all`), the rootless path. `just compose-up` sets
# sensible local defaults (workspace = ./data, models = host ~/.ollama).
name: medmcp

services:
  llm:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      # Keep gemma4-medmcp resident in VRAM (-1) so it isn't evicted after the
      # 5-minute idle default and reloaded on the next prompt. Override with a
      # duration (e.g. 30m) on shared GPUs to release VRAM when idle.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
    devices:
      - "nvidia.com/gpu=${MEDMCP_GPU:-all}"
    volumes:
      - "${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  llm-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://llm:11434"
    volumes:
      - "./Modelfile.gemma4:/Modelfile.gemma4:ro"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama list | grep -q gemma4-medmcp || { ollama pull gemma4:26b && ollama create gemma4-medmcp -f /Modelfile.gemma4; }'
    restart: "no"

  llm-warmup:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      llm:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: "http://llm:11434"
    entrypoint: ["/bin/sh", "-c"]
    # Preload the model into VRAM at startup so the first prompt is instant
    # instead of paying the cold-load latency. Nothing depends on this service,
    # so the core UI still comes up immediately while the model warms.
    command:
      - 'ollama run gemma4-medmcp "ok" </dev/null >/dev/null 2>&1 || true'
    restart: "no"

  medmcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${MEDMCP_BASE_IMAGE:-medmcp-base:dev}"
    image: medmcp-core:dev
    depends_on:
      llm:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: "http://llm:11434"
      MEDMCP_WORKSPACE: "${MEDMCP_WORKSPACE:?set MEDMCP_WORKSPACE to an absolute host path}"
      # Catalog source: empty = bundled catalog.json (local :dev images). To pull
      # the published images, set MEDMCP_CATALOG_URL=/app/catalog.ghcr.json.
      MEDMCP_CATALOG_URL: "${MEDMCP_CATALOG_URL:-}"
      # GPU the LLM + GPU stacks target (CDI device id). "all" = every GPU; pin
      # with an index/UUID, e.g. MEDMCP_GPU=0.
      MEDMCP_GPU: "${MEDMCP_GPU:-all}"
      # Optional registry login inside the core — for credential-helper hosts
      # that mount no plaintext auths. Leave empty to use the mounted config.
      GHCR_USER: "${GHCR_USER:-}"
      GHCR_TOKEN: "${GHCR_TOKEN:-}"
      # Persistent stack pool + pre-warm proxy (Layer 1): keeps stack backends
      # warm across calls and hides pool-machinery tools (warmup) from the model.
      # 1/true to enable; empty = off (legacy per-call spawn).
      MEDMCP_STACK_POOL: "${MEDMCP_STACK_POOL:-}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8100/healthz")
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      # Rootless docker socket → core spawns sibling stack containers.
      # Rootful hosts: override XDG_RUNTIME_DIR or set the path to /var/run.
      - "${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock"
      # Workspace at an identical absolute path (path parity for nested run -v).
      - "${MEDMCP_WORKSPACE}:${MEDMCP_WORKSPACE}"
      # Container-stack manifests (read-write so UI install/uninstall can persist).
      - "./stacks.d:/app/stacks.d"
      # Persist user state across recreates: personal workflows, provenance, and
      # chat transcripts. Without these, .vibe lives in the ephemeral container
      # layer and every recreate (compose down/up, image update) wipes them.
      # Subdirs only — the baked prompts/ and the startup-written config.toml
      # stay image-fresh.
      - "vibe-workflows:/app/.vibe/workflows"
      - "vibe-provenance:/app/.vibe/provenance"
      - "vibe-logs:/app/.vibe/logs"
      # Host registry creds, read-only at a staging path — the entrypoint copies
      # only `auths` to /root/.docker/config.json, dropping the host's
      # `currentContext` (which would break every in-container stack pull/run).
      # Published images pull anonymously; for non-public ones, `docker login
      # ghcr.io` on the host first. (If the host uses a credential helper rather
      # than plain auths, pre-pull on the host instead.)
      - "${HOME}/.docker/config.json:/run/host-docker-config.json:ro"
    restart: unless-stopped

volumes:
  ollama-models:
  vibe-workflows:
  vibe-provenance:
  vibe-logs:
