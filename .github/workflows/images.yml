name: Images

# On push to main: build base + core and push to the private GHCR (ghcr.io/medmcp).
# On pull_request: build only (validates the Dockerfiles) — no login, no push.
# Plain `docker build` on the runner's daemon so core can FROM the just-built base
# without a registry round-trip. amd64 only — build arm64 natively on an aarch64
# runner / the Spark (QEMU is too slow for the CUDA/torch compiles).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CUDA_TAG: "12.8.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build base + core
        run: |
          docker build -f Dockerfile.base --build-arg CUDA_TAG="${CUDA_TAG}" -t medmcp-base:ci .
          docker build --build-arg BASE_IMAGE=medmcp-base:ci -t medmcp-core:ci .
      - name: Smoke test (entrypoint sanitizer + server boots)
        run: |
          # A host-like docker config carrying the leaked context + a credential
          # helper, mounted where the entrypoint sanitizes it.
          printf '{"auths":{"ghcr.io":{"auth":"dGVzdA=="}},"currentContext":"rootless","credsStore":"pass"}' \
            > /tmp/host-docker-config.json
          docker run -d --name medmcp-smoke \
            -v /tmp/host-docker-config.json:/run/host-docker-config.json:ro \
            -e MEDMCP_GPU=all \
            medmcp-core:ci
          # Wait for the server to answer /healthz.
          ok=
          for _ in $(seq 1 30); do
            if docker exec medmcp-smoke python3 -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')" 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::server never became healthy"; docker logs medmcp-smoke; exit 1; }
          # The entrypoint must have reduced the mounted config to auths-only.
          keys=$(docker exec medmcp-smoke python3 -c \
            "import json; print(sorted(json.load(open('/root/.docker/config.json')).keys()))")
          echo "sanitized config keys: $keys"
          [ "$keys" = "['auths']" ] || { echo "::error::config not sanitized: $keys"; docker logs medmcp-smoke; exit 1; }
          echo "smoke test passed"
      - name: Smoke test cleanup
        if: always()
        run: docker rm -f medmcp-smoke 2>/dev/null || true
      - name: Push to GHCR (main only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in base core; do
            docker tag "medmcp-$img:ci" "ghcr.io/medmcp/$img:${{ github.sha }}"
            docker tag "medmcp-$img:ci" "ghcr.io/medmcp/$img:main"
            docker push "ghcr.io/medmcp/$img:${{ github.sha }}"
            docker push "ghcr.io/medmcp/$img:main"
          done
      - name: Publish deploy compose as an OCI artifact (main only)
        if: github.event_name != 'pull_request'
        run: |
          # Publish the self-contained deploy compose so nodes can run it with no
          # checkout:  docker compose -f oci://ghcr.io/medmcp/compose:main up -d
          # Reuses the docker login from the push step above. MEDMCP_WORKSPACE is
          # set only to satisfy publish-time interpolation of its required
          # ${...:?} value; it is NOT baked into the artifact (no --with-env), so
          # consumers still supply their own path at `up` time.
          for tag in "${{ github.sha }}" main; do
            MEDMCP_WORKSPACE=/run/medmcp \
              docker compose -f docker-compose.ghcr.yml publish \
              "ghcr.io/medmcp/compose:$tag" -y
          done
