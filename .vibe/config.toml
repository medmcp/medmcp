active_model = "local"
vim_keybindings = false
disable_welcome_banner_animation = false
autocopy_to_clipboard = true
file_watcher_for_autocomplete = false
auto_compact_threshold = 115000
context_warnings = false
auto_approve = false
# vibe ≥2.24 starts in its accept-edits profile unless told otherwise, and a
# profile's overrides sit above this file — write_file/edit would be "always"
# no matter what [tools.*] says. ask keeps every edit behind the prompt.
default_agent = "ask"
# vibe's one-shot allowlist migration otherwise unions its read-only defaults
# into the deliberately empty [tools.bash] allowlist on every start.
applied_migrations = ["bash_read_only_defaults_v1"]
system_prompt_id = "medmcp"
include_commit_signature = true
include_model_info = true
include_project_context = true
include_prompt_detail = true
api_timeout = 720.0
enable_telemetry = false
enable_update_checks = false
enable_auto_update = false
enable_notifications = true
tool_paths = []
enabled_tools = []
disabled_tools = [
    "web_search",
]
agent_paths = []
enabled_agents = []
disabled_agents = []
skill_paths = []
enabled_skills = []
disabled_skills = [
    "skill-creator",
    "vibe",
]

[[providers]]
name = "ollama"
api_base = "http://localhost:11434/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
# Ollama names the reasoning channel differently per mode: "reasoning_content" when
# non-streaming, "reasoning" in stream deltas. vibe streams, so this must be
# "reasoning" — otherwise the key never matches and the model's entire answer is
# dropped (LLMMessage ignores extras), leaving turns visibly empty.
reasoning_field_name = "reasoning"
project_id = ""
region = ""

[[models]]
name = "muse-medmcp"
provider = "ollama"
alias = "local"
# Must match Modelfile.muse. This value is sent on every request, and a request
# option overrides the Modelfile's PARAMETER — so while this said 1.0 the
# Modelfile's 0.3 never applied. Low temperature is deliberate: the model is
# choosing tool arguments and file paths, where creativity is a defect.
temperature = 0.3
input_price = 0.0
output_price = 0.0
thinking = "medium"

[project_context]
max_chars = 40000
default_commit_count = 5
max_doc_bytes = 32768
truncation_buffer = 1000
max_depth = 3
max_files = 1000
max_dirs_per_level = 20
timeout_seconds = 2.0

[tools.task]
permission = "always"
allowlist = []
denylist = []

[tools.write_file]
permission = "ask"
allowlist = []
denylist = []
max_write_bytes = 64000
create_parent_dirs = true

[tools.todo]
permission = "always"
allowlist = []
denylist = []
max_todos = 100

[tools.edit]
permission = "ask"
allowlist = []
denylist = []
max_content_size = 100000
create_backup = false
fuzzy_threshold = 0.9

[tools.read_file]
permission = "always"
allowlist = []
denylist = []
max_read_bytes = 64000

[tools.grep]
permission = "always"
allowlist = []
denylist = []
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
exclude_patterns = [
    ".venv/",
    "venv/",
    ".env/",
    "env/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".tox/",
    ".nox/",
    ".coverage/",
    "htmlcov/",
    "dist/",
    "build/",
    ".idea/",
    ".vscode/",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "Thumbs.db",
]
codeignore_file = ".vibeignore"

[tools.ask_user_question]
permission = "always"
allowlist = []
denylist = []

[tools.web_fetch]
# The one tool that can reach the network. Never "always": every fetch is a
# decision the person makes, and the README's security section says so.
permission = "ask"
allowlist = []
denylist = []

[tools.bash]
permission = "ask"
allowlist = []
denylist_standalone = []
sensitive_patterns = [
    "sudo",
]
