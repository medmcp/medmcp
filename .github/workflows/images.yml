name: Images

# Build + push the base and core images to the private GitHub Container Registry.
# Packages are created PRIVATE by default; keep the org policy at "private only".
# amd64 only for now — build arm64 natively on an aarch64 runner / the Spark
# (QEMU is too slow for the CUDA/torch compiles).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CUDA_TAG: "12.8.1"

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_TAG=${{ env.CUDA_TAG }}
          tags: |
            ghcr.io/medmcp/base:${{ github.sha }}
            ghcr.io/medmcp/base:main
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  core:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:${{ github.sha }}
          tags: |
            ghcr.io/medmcp/core:${{ github.sha }}
            ghcr.io/medmcp/core:main
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
